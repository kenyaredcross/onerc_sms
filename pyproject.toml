[project]
name = "onerc_sms"
authors = [
    { name = "Kelvin Njenga", email = "njengasheba@gmail.com"}
]
description = "SMS module for OneRC Core"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    #
    # The gateway SDKs are hard dependencies, not extras, so that
    # `bench get-app` installs them and bringing a society online is only ever
    # "paste the credentials into an SMS Provider row". An adapter whose SDK is
    # missing is the one failure mode an operator cannot diagnose from the desk,
    # and it is not worth saving a few megabytes to keep it possible.
    "africastalking~=2.0.3",
    "twilio>=9.0.0,<10.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Which Frappe this app is built against. Its absence is what made the install
# fail with "Could not find a compatible Frappe version in pyproject.toml".
#
# **Deliberately wider than `onerc_core` and `vmmsx`, which both say
# `>=16.0.0,<17.0.0`.** Bench compares with `semantic_version`, not PEP 440, and
# under those rules a prerelease is outside a range that does not mention one:
#
#     Version("17.0.0-dev") in SimpleSpec(">=16.0.0,<17.0.0")   -> False
#     Version("17.0.0-dev") in SimpleSpec(">=16.0.0,<18.0.0")   -> True
#
# The bench this was built and tested on runs `17.0.0-dev`, so the narrower
# range would refuse the very environment the app works in. `<18.0.0` accepts
# v16 stable, the v17 line and that dev build, and still refuses v15 — which
# this app genuinely does not support, since it needs Python 3.14.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
